controller_list:
  - name: /z1_gazebo/z1_joint_traj_controller
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

z1_joint_traj_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
  stop_trajectory_duration: 0.5
  state_publish_rate: 50
  action_monitor_rate: 20
  constraints:
    goal_time: 3.0
    joint1: {goal: 0.05}
    joint2: {goal: 0.05}
    joint3: {goal: 0.05}
    joint4: {goal: 0.05}
    joint5: {goal: 0.05}
    joint6: {goal: 0.05}
